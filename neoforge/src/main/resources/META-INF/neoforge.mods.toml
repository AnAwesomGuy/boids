modLoader="javafml"
loaderVersion="[1.0,)"
license="MIT"
logoFile="assets/${mod_id}/icon.png"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="Tomate0613, AnAwesomGuy"
